<!DOCTYPE html>
<html>
<head>
  <title>Apply for Loan</title>
  <style>
    body {
      background: #020617;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-box {
      background: #0f172a;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    h2 {
      text-align: center;
      color: #38bdf8;
    }
    label {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      color: #cbd5f5;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      margin-top: 30px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <form class="form-box" action="/apply-loan" method="post" enctype="multipart/form-data">
    <h2>Loan Application</h2>

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Upload PDF Document</label>
    <input type="file" name="pdf" accept="application/pdf" required>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
