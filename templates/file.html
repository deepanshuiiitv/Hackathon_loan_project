<!DOCTYPE html>
<html>
<head>
  <title>Upload Documents</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">
  <div class="card wide">
    <h2>Upload Required Documents</h2>

    <form id="upload" enctype="multipart/form-data">

      <label>Document 1 (PDF / Image)</label>
      <input id="salary" type="file" required accept=".pdf,.jpg,.png">

      <label style="margin-top:10px">Document 2 (PDF / Image)</label>
      <input id="bank" type="file" required accept=".pdf,.jpg,.png">

      <p style="font-size:12px;color:#94a3b8">
        Exactly 2 documents are mandatory
      </p>

      <button id="analyzeBtn" class="btn">Analyze</button>
    </form>

    <pre id="output"></pre>
  </div>

<script>
document.getElementById("upload").onsubmit = async (e) => {
  e.preventDefault();

  const btn = document.getElementById("analyzeBtn");
  btn.disabled = true;
  btn.textContent = "Analyzing...";
  btn.style.opacity = "0.6";
  btn.style.cursor = "not-allowed";

  try {
    const salary = document.getElementById("salary").files[0];
    const bank = document.getElementById("bank").files[0];

    if (!salary || !bank) {
      alert("Both documents are required.");
      throw new Error("Missing files");
    }

    const formData = new FormData();
    formData.append("files", salary);
    formData.append("files", bank);

    const res = await fetch("/predict_from_files", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    document.getElementById("output").textContent =
      JSON.stringify(data, null, 2);

  } catch (err) {
    console.error(err);
    alert("Something went wrong. Please try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyze";
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
  }
};
</script>

</body>
</html>
